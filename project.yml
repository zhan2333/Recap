# project.yml — xcodegen manifest for the Recap Mac Catalyst app.
# Created by Rio on 2026/8/19.
name: RecapApp
options:
  bundleIdPrefix: com.rio
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
packages:
  RecapKit:
    path: RecapKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
targets:
  RecapPDFTestHost:
    type: application
    platform: iOS
    sources:
      - Tests/PDFReaderHost
      - path: App
        includes:
          - Models/Library.swift
          - Models/Library+Files.swift
          - Models/PriorAnalysis.swift
          - Models/PDFNavigation.swift
          - UI/PDFViewController.swift
          - UI/PDFLinkView.swift
          - UI/BrandToolbarDelegate.swift
          - UI/AboutViewController.swift
          - UI/PDFOutlineViewController.swift
          - UI/PDFFindViewController.swift
          - UI/RecapTheme.swift
          - Localizable.xcstrings
    dependencies:
      - package: RecapKit
        product: AnalysisKit
      - package: RecapKit
        product: TranscriptionKit
      - package: RecapKit
        product: PipelineKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rio.Recap.PDFTestHost
        SWIFT_EMIT_LOC_STRINGS: false
        INFOPLIST_FILE: ""
        INFOPLIST_KEY_CFBundleDisplayName: Recap PDF
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        SUPPORTS_MACCATALYST: true
        TARGETED_DEVICE_FAMILY: "2,6"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true

  RecapPDFTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        includes:
          - PDFReaderTests.swift
          - AboutViewTests.swift
    dependencies:
      - target: RecapPDFTestHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rio.Recap.PDFTests
        INFOPLIST_FILE: ""
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/RecapPDFTestHost.app/Contents/MacOS/RecapPDFTestHost"
        SUPPORTS_MACCATALYST: true
        TARGETED_DEVICE_FAMILY: "2,6"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true

  RecapLibraryTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
        excludes:
          - PDFReaderHost
          - PDFReaderTests.swift
          - AboutViewTests.swift
      - path: App
        includes:
          - Models/Library.swift
          - Models/Library+Files.swift
          - Models/PriorAnalysis.swift
          - Models/PDFNavigation.swift
          - Models/UpdateInstaller.swift
      - path: Plugin
        includes:
          - ShellRunner.swift
    dependencies:
      - package: RecapKit
        product: AnalysisKit
      - package: RecapKit
        product: TranscriptionKit
      - package: RecapKit
        product: PipelineKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rio.Recap.LibraryTests
        INFOPLIST_FILE: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true

  RecapShellPlugin:
    type: bundle
    platform: macOS
    deploymentTarget: "13.0"
    sources: [Plugin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rio.Recap.ShellPlugin
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true

  Recap:
    type: application
    platform: iOS
    sources:
      - App
      - path: AppIcon.icon
        type: file
    dependencies:
      - package: RecapKit
        product: TranscriptionKit
      - package: RecapKit
        product: PipelineKit
      - package: RecapKit
        product: AnalysisKit
      - package: SwiftTerm
      - target: RecapShellPlugin
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Recap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        SUPPORTS_MACCATALYST: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2,6"   # iPad + Mac idiom (Optimized for Mac)
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        "ARCHS[sdk=macosx*]": arm64
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "2.5.2"
        SWIFT_EMIT_LOC_STRINGS: true

schemes:
  RecapPDFTestHost:
    build:
      targets:
        RecapPDFTestHost: all
    run:
      config: Debug

  RecapPDFTests:
    build:
      targets:
        RecapPDFTests: [test]
    test:
      targets:
        - RecapPDFTests

  Recap:
    build:
      targets:
        Recap: all
    run:
      config: Debug
    archive:
      config: Release

  RecapLibraryTests:
    build:
      targets:
        RecapLibraryTests: [test]
    test:
      targets:
        - RecapLibraryTests
