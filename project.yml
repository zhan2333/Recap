# project.yml — xcodegen manifest for the Recap Mac Catalyst app.
# Created by Rio on 2026/8/19.
name: RecapApp
options:
  bundleIdPrefix: com.rio
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
packages:
  RecapKit:
    path: RecapKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
targets:
  RecapShellPlugin:
    type: bundle
    platform: macOS
    deploymentTarget: "13.0"
    sources: [Plugin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rio.Recap.ShellPlugin
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true

  Recap:
    type: application
    platform: iOS
    sources:
      - App
      - path: AppIcon.icon
        type: file
    dependencies:
      - package: RecapKit
        product: TranscriptionKit
      - package: RecapKit
        product: PipelineKit
      - package: RecapKit
        product: AnalysisKit
      - package: SwiftTerm
      - target: RecapShellPlugin
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Recap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        SUPPORTS_MACCATALYST: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2,6"   # iPad + Mac idiom (Optimized for Mac)
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "2.1.1"
        SWIFT_EMIT_LOC_STRINGS: true
