# project.yml — xcodegen manifest for the Recap Mac Catalyst app.
# Created by Rio on 2026/8/19.
name: RecapApp
options:
  bundleIdPrefix: com.rio
  deploymentTarget:
    iOS: "17.0"
packages:
  RecapKit:
    path: RecapKit
targets:
  Recap:
    type: application
    platform: iOS
    sources:
      - App
      - path: AppIcon.icon
        type: file
    dependencies:
      - package: RecapKit
        product: TranscriptionKit
      - package: RecapKit
        product: PipelineKit
      - package: RecapKit
        product: AnalysisKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Recap
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        SUPPORTS_MACCATALYST: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2,6"   # iPad + Mac idiom (Optimized for Mac)
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.9"
